<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM and Arrays Interactive Image Gallery</title>
    <script src="js/main.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <div class="bg-white rounded-3 shadow p-3 p-md-4">
        <h1 id="title" class="text-center mb-4">Welcome</h1>
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3"><img id="img0" class="img-fluid rounded w-100" style="height:180px;object-fit:cover" src="" alt=""></div>
            <div class="col-6 col-md-3"><img id="img1" class="img-fluid rounded w-100" style="height:180px;object-fit:cover" src="" alt=""></div>
            <div class="col-6 col-md-3"><img id="img2" class="img-fluid rounded w-100" style="height:180px;object-fit:cover" src="" alt=""></div>
            <div class="col-6 col-md-3"><img id="img3" class="img-fluid rounded w-100" style="height:180px;object-fit:cover" src="" alt=""></div>
        </div>
    
    <div>
        <button id="changeImgBtn" class="btn btn-primary" type="button" >Change Images</button>
    </div>

    <div>
        <label for="messageInput">Heading message</label>
        <input id="messageInput" class="form-control" type="text" placeholder="Type a message...">
    </div>
    
    <div>
        <label for="colorSelect">Background color</label>
        <select id="colorSelect" class="form-select"></select>
    </div>
    
    <div>
        <label for="colorInput">Add a color</label>
        <input id="colorInput" class="form-control" type="text" placeholder="Enter a color name, such as coral">
    </div>
    </div>
</main>
</body>
</html>
