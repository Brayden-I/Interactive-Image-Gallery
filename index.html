<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM and Arrays Interactive Image Gallery</title>
    <script src="js/main.js" defer></script>
</head>
<body>
    <h1 id="title">Welcome</h1>
    
    <div>
        <img id="img0" src="" alt="">
        <img id="img1" src="" alt="">
        <img id="img2" src="" alt="">
        <img id="img3" src="" alt="">
    </div>
    
    <div>
        <button id="changeImgBtn" type="button">Change Images</button>
    </div>

    <div>
        <label for="messageInput">Heading message</label>
        <input type="text" id="messageInput" placeholder="Type a message...">
    </div>
    
    <div>
        <label for="colorSelect">Background color</label>
        <select id="colorSelect"></select>
    </div>
    
    <div>
        <label for="colorInput">Add a color</label>
        <input id="colorInput" type="text" placeholder="Enter a color name, such as coral">
    </div>
</body>
</html>
